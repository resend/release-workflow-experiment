name: Publish

on:
  push:
    branches:
      - main
      - canary
      - release-*
  workflow_dispatch:
    inputs:
      debug:
        description: Run npm publish directly with verbose output instead of tegami
        type: boolean
        default: false

concurrency:
  group: publish-${{ github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: pnpm --dir tooling install --frozen-lockfile

      - run: |
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"

      - name: Version and commit on main
        if: github.ref_name == 'main'
        run: |
          pnpm --dir tooling exec tsx tegami.mts version --no-checks
          if ! git diff --quiet; then
            git add -A
            git commit -m "Release $(node -p "require('./package.json').version") [skip ci]"
            git push origin HEAD:main
          fi
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}

      - name: Debug npm publish
        if: inputs.debug
        run: pnpm publish --tag debug --no-git-checks --loglevel debug

      - id: tegami
        if: ${{ !inputs.debug }}
        run: pnpm --dir tooling exec tsx tegami.mts ${{ github.ref_name == 'main' && 'publish' || 'ci' }}
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}

      - name: Mark GitHub release as not latest
        if: steps.tegami.outputs.published == 'true' && steps.tegami.outputs.took_latest == 'false' && github.ref_name != 'canary'
        run: gh release edit "$(node -p "p=require('./package.json');p.name+'@'+p.version")" --latest=false
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}

      - name: Fast-forward main to canary
        if: github.ref_name == 'canary' && steps.tegami.outputs.exit_prerelease == 'true'
        run: git push origin HEAD:main

      - name: Reset release-<major> to main
        if: github.ref_name == 'main' && steps.tegami.outputs.published == 'true'
        run: git push --force origin HEAD:release-$(node -p "require('./package.json').version.split('.')[0]")

      - name: Fast-forward canary to main
        if: github.ref_name == 'main' && steps.tegami.outputs.published == 'true'
        run: |
          if ! git push origin HEAD:canary; then
            gh pr create --base canary --head main --title "Sync canary with main after $(node -p "require('./package.json').version")" --body "Canary moved during the release. Merge with a merge commit, not squash."
          fi
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}

      - name: Re-draft canary
        if: startsWith(github.ref_name, 'release-') && steps.tegami.outputs.published == 'true'
        run: gh workflow run publish.yml --ref canary
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}

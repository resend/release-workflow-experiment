name: Tegami PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: pnpm --dir tooling install --frozen-lockfile

      - run: pnpm --dir tooling exec tsx tegami.mts pr preview --artifact $RUNNER_TEMP/preview.md

      - uses: actions/upload-artifact@v4
        with:
          name: tegami-pr-preview
          path: ${{ runner.temp }}/preview.md
